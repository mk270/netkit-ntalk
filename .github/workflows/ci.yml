name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libncurses-dev \
              clang python3
      - name: Build with hardening flags (no libwrap)
        run: |
          cmake -S . -B build -DUSE_LIBWRAP=OFF \
              -DCMAKE_C_FLAGS="-O2 -Wall -Wextra -D_FORTIFY_SOURCE=2 -fstack-protector-strong"
          cmake --build build
      - name: Sanitizer tests (ASan, UBSan, MSan)
        run: tests/run.sh
